{{ $feedURL := . }}

<!-- Styles -->
<!--
<link rel="stylesheet" href="{{ "css/updates.css" | relURL }}">
-->

<section class="header-upt">
	<div class="weltext">
<!--
		<h1>Recent Activity</h1>
-->
				<section class="post-card">
			<a href="{{ $feedURL }}">
				<h1>Subscribe to feed</h1>
			</a>
		</section>
	</div>
</section>

<br>

<div id="commit-feed"></div>

<script>
async function fetchCommits(url) {
	try {
		const response = await fetch(url);
		const data = await response.json();
		const container = document.getElementById("commit-feed");

		container.innerHTML = "";

		data
			.filter(entry => entry.op_type === "commit_repo")
			.slice(0, 15)
			.forEach(entry => {
				const user = entry.act_user;
				const repo = entry.repo;
				let content, commits = [];

				try {
					content = JSON.parse(entry.content);
					if (Array.isArray(content?.Commits))
						commits = content.Commits;
				} catch {
					return;
				}

				commits.forEach(commit => {
					const commitUrl =
						"https://codeberg.org/" +
						repo.full_name +
						"/commit/" +
						commit.Sha1;

					const lines = (commit.Message || "")
						.split(/\r?\n+/);

					const title = lines[0] || "";
					const body = lines[1] || "";

					const card = document.createElement("div");
					card.className = "commit-card";

					const [ownerName, repoName] = repo.full_name.split("/");

					const ownerUrl = `https://codeberg.org/${ownerName}`;
					const repoUrl = `https://codeberg.org/${repo.full_name}`;

					const ownerAvatar = repo.owner?.avatar_url || `https://codeberg.org/user/avatar/${ownerName}/-1`;

					const repoBlock = `
					<div class="repo-header">
							<a href="${ownerUrl}" target="_blank" class="owner-link">
									<img src="${ownerAvatar}" alt="${ownerName}'s avatar" class="owner-avatar">
									<span class="owner-name">${ownerName}</span>
							</a>

							<a href="${repoUrl}" target="_blank" class="repo-link">
									<div class="repo-title">${repoName}</div>
							</a>
					</div>
					`;


					const commitBlock = `
					<div class="commit-content">
						<h4 class="commit-title">
							<a href="${commitUrl}" target="_blank">${title}</a>
						</h4>

						${
							body
								? `<div class="commit-description">${body}</div>`
								: ""
						}

						<a href="${commitUrl}" class="commit-date-button" target="_blank">
							${new Date(
								commit.Timestamp || entry.created
							).toLocaleString()}
						</a>
					</div>
					`;

					card.innerHTML = repoBlock + commitBlock;
					container.appendChild(card);

									});
								});
						} catch (error) {
							console.error("Feed error:", error);
						}
					}

					fetchCommits("{{ $feedURL }}");
</script>
